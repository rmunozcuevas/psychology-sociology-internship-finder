name: Deploy Path49 to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'sociology.html'
      - 'sociology.css'
      - 'sociology-rules.json'
      - 'sociology-opportunities.json'
      - 'app.js'
      - 'eligibility.mjs'
      - 'resume-fit.mjs'
      - 'listing-quality.mjs'
      - 'student-tools.mjs'
      - 'opportunity-rules.json'
      - 'program-eligibility.json'
      - 'local-programs.json'
      - 'source-health.json'
      - 'sources.html'
      - 'coverage.css'
      - 'coverage.js'
      - 'api/**'
      - 'data/source-history.sqlite'
      - 'styles.css'
      - 'identity.css'
      - 'brand-icon.svg'
      - 'opportunities.json'
      - '.github/workflows/deploy-pages.yml'
  workflow_run:
    workflows: [Refresh internship listings]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Configure public API address
        env:
          API_BASE: ${{ vars.API_BASE }}
        run: printf "window.FIELDNOTE_API_URL='%s';\n" "$API_BASE" > config.js
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
